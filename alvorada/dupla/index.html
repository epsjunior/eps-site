<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Alvorada</title>
<!-- A prévia do convite em dupla (EPS-291).

     Genérica e sem nada do convite: o código viaja na URL porque é a chave, mas
     ele não aparece em lugar nenhum desta página, e a prévia não diz quem
     convidou nem qual propósito. O rastreador do WhatsApp buscar esta URL não
     queima o convite — aceitar exige chamada autenticada do app. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Alvorada">
<meta property="og:title" content="Um convite para fazer em dupla">
<meta property="og:description" content="Vocês veem os dias um do outro num propósito do Alvorada. Só os dias concluídos — nada do que cada um escreve.">
<meta property="og:url" content="https://eps.dev.br/alvorada/dupla">
<meta property="og:image" content="https://eps.dev.br/alvorada/marca-dia.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<!-- Esta URL é um link universal: num aparelho com o Alvorada instalado, o sistema
     abre o app antes de chegar aqui. Quem chega é quem não tem o app, ou abriu no
     navegador de propósito, e vai para a página inicial levando o destino no
     parâmetro "abrir", de onde o botão "Abrir no aplicativo" parte. -->
<script>location.replace('/alvorada/?abrir=' + encodeURIComponent('/dupla' + location.search));</script>
<noscript><meta http-equiv="refresh" content="0; url=/alvorada/"></noscript>
</head>
<body>
<p>Indo para <a href="/alvorada/">eps.dev.br/alvorada</a>…</p>
</body>
</html>
