<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Alvorada</title>
<!-- A pré-visualização do convite (EPS-291).

     O convite ao propósito passou a sair do app como TEXTO com link, e não como
     imagem: uma imagem não carrega um toque, e quem recebia tinha de digitar o
     endereço impresso no rodapé do cartão. O que devolve a figura é isto — o
     WhatsApp lê estas tags e monta a prévia, então a mensagem chega com texto,
     link tocável e imagem numa folha só.

     É GENÉRICA de propósito, e não por preguiça: este site é HTML estático no
     GitHub Pages e a página não pode variar com a query string. Quem nomeia o
     propósito é a mensagem que o app escreve ("Vou fazer o propósito X no
     Alvorada — são 7 dias. Vem comigo?"), e é ela que tem de fazer sentido
     sozinha, porque prévia nenhuma é garantida. Uma prévia por propósito exigiria
     um diretório por slug, e isso é decisão de outro dia. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Alvorada">
<meta property="og:title" content="Um propósito no Alvorada">
<meta property="og:description" content="Alguns dias seguidos sobre um tema, com um devocional narrado por manhã. Sem anúncios.">
<meta property="og:url" content="https://eps.dev.br/alvorada/proposito">
<meta property="og:image" content="https://eps.dev.br/alvorada/marca-dia.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<!-- Esta URL é um link universal: num aparelho com o Alvorada instalado, o sistema
     abre o app antes de chegar aqui. Quem chega é quem não tem o app, ou abriu no
     navegador de propósito, e vai para a página inicial levando o destino no
     parâmetro "abrir", de onde o botão "Abrir no aplicativo" parte.

     "proposito" é o nome público (EPS-218); a rota do app continua "/programa", e
     é ela que viaja no "abrir" — o botão da página inicial monta um esquema
     alvorada://, que não passa pelo tradutor de URLs do app. /alvorada/programa/
     continua existindo, para sempre, pelos links já compartilhados. -->
<script>location.replace('/alvorada/?abrir=' + encodeURIComponent('/programa' + location.search));</script>
<noscript><meta http-equiv="refresh" content="0; url=/alvorada/"></noscript>
</head>
<body>
<p>Indo para <a href="/alvorada/">eps.dev.br/alvorada</a>…</p>
</body>
</html>
